site_name: pytest-graphql
site_description: Schema-aware GraphQL API testing for pytest.
site_url: https://skhomenko.github.io/pytest-graphql/
strict: true

# docs/reference/ is contributor documentation. It is never published, so it
# stays out of the build output and the navigation. tests/docs proves it.
exclude_docs: |
  reference/

# The fifteen pages of SPEC section 13, in its order, then the generated API
# reference. The first page is index.md so the site root is the Quickstart.
nav:
  - Quickstart: index.md
  - Configuration: configuration.md
  - Selections: selections.md
  - Responses: responses.md
  - Assertions: assertions.md
  - Errors: errors.md
  - Factory: factory.md
  - Authentication: authentication.md
  - Polling: polling.md
  - Diagnostics: diagnostics.md
  - Extending: extending.md
  - Using without pytest: without-pytest.md
  - Cookbook: cookbook.md
  - Migrating from a hand-rolled client: migrating.md
  - FAQ: faq.md
  - API reference: api.md

# A link to a page, a file or an anchor that does not exist is a warning, so
# --strict fails on it. Anchors are info by default, and the guide pages link to
# headings in the generated API reference, so a renamed name must fail the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Drops the Lunr language packs, which search does not load for English and
# which carry Mozilla Public License headers. See mkdocs_hooks.py.
hooks:
  - mkdocs_hooks.py

theme:
  name: material
  # Material loads Google Fonts by default, so a visitor's browser would contact
  # a third party on every page view. System fonts avoid that.
  font: false
  features:
    - content.code.copy

# No repo_url: Material would then fetch repository facts from the GitHub API in
# every visitor's browser. The footer credit is switched off for the same reason
# the rest of the site carries no tool trailer.
extra:
  generator: false

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            # Every name in __all__ must appear, documented or not, so a
            # missing docstring is visible on the page and not a silent gap.
            show_if_no_docstring: true
            # The default hides private names. A lone underscore is hidden too:
            # it marks the dataclass fields after it as keyword-only and is not
            # a field. __all__ is left out: it is the list this page is
            # generated from, not a thing to document. Five dunders carry no
            # information for a reader (__slots__ is storage, __repr__ and
            # __str__ are display, __eq__ and __hash__ are comparison and
            # __post_init__ is validation), so they are left out as well. Every
            # other dunder is a way to use the object and stays.
            filters:
              - "!^_[^_]"
              - "!^_$"
              - "!^__all__$"
              - "!^__(slots|repr|str|eq|hash|post_init)__$"
            # Docstrings are Google style, with Args, Returns, Raises and
            # Examples sections. A field is documented by the string under it.
            # The constructor parameters are written in the class docstring and
            # shown with the class, so there is no separate __init__ entry.
            docstring_style: google
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            # Source order puts the fields and methods of a class in the order
            # the author wrote them, which is the order a reader meets them in.
            members_order: source

# Python code blocks carry {.exec} or {.no-exec} after the language, which
# superfences renders as a CSS class and still highlights as Python. Do not add
# pymdownx.snippets: it would pull code into a page that tests/docs never sees.
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
