input CreatePostInput {
  title: String!
  authorId: ID!
}

input MovePostInput {
  teamId: ID!
}

type Query {
  node(id: ID!): Node
  user(id: ID!): User
  users: [User!]!
  team(id: ID!): Team
  teams: [Team!]!
  post(id: ID!): Post
  settings: Settings
  reservedWordFields: ReservedWordFields
  search(term: String!): [SearchResult!]!
  wide: WideType
  matrix: [[String!]!]!
  pingScalar: Boolean!
  nullableList: [String]
  nonNullListOfNullables: [String]!
  pyKeyword: PyKeyword!
  pyKeywordEcho(value: PyKeyword!): PyKeyword!
}

type Mutation {
  updateUser(id: ID!, name: String): User!
  createPost(input: CreatePostInput!): Post!
  movePost(id: ID!, data: MovePostInput!): Post!
}
