"""
The hostile test schema.

Checklist coverage (docs/reference/SPEC.md 11.1):

- Direct self-reference:            User.manager
- Indirect cycle:                   User -> Team -> User (Team.captain)
- Diamond reuse, not a cycle:       Post.author and Post.editor both -> User
- Interface, three implementations: Node <- User, Team, Post
- Union of unrelated types:         SearchResult = User | Team | Attachment
- Relay connection:                 User.postsConnection
- Required-argument object field:   User.posts(first: Int!)
- Optional argument with default:   User.friends(limit: Int = 10)
- Deprecated fields, incl. object:  User.oldName, User.legacyManager
- Custom scalars, one unregistered: DateTime, UUID, JSON, Upload, Money
- Deeply wrapped types:             Query.matrix, User.looseFriends, User.strictFriends
- A type with no id field:          Settings
- Reserved / builtin field names:   ReservedWordFields
- snake_case collision pair:        User.userId, User.user_id
- Enum of Python keywords:          PyKeyword
- Mutations, three argument shapes: updateUser, createPost, movePost
- A 300-field type, size guard:     WideType
- Scalar / list / null shapes:      Query.pingScalar, nullableList, nonNullListOfNullables
"""

scalar DateTime
scalar UUID
scalar JSON
scalar Upload
scalar Money

interface Node {
  id: ID!
}

type User implements Node {
  id: ID!
  name: String!
  manager: User
  team: Team
  posts(first: Int!): [Post!]!
  friends(limit: Int = 10): [User!]!
  looseFriends: [User]
  strictFriends: [User!]
  postsConnection(first: Int, after: String): PostConnection!
  oldName: String @deprecated(reason: "renamed to name")
  legacyManager: User @deprecated(reason: "use manager")
  userId: ID!
  user_id: ID!
  joinedAt: DateTime!
  externalId: UUID!
  preferences: JSON
  avatar: Upload
  balance: Money
}

type Team implements Node {
  id: ID!
  name: String!
  captain: User
  members: [User!]!
}

type Post implements Node {
  id: ID!
  title: String!
  author: User!
  editor: User
}

type Attachment {
  filename: String!
  sizeBytes: Int!
}

union SearchResult = User | Team | Attachment

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type PostEdge {
  cursor: String!
  node: Post!
}

type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!
}

type Settings {
  theme: String
  locale: String
}

type ReservedWordFields {
  id: ID!
  from: String
  class: String
  type: String
  keys: [String!]!
  items: [String!]!
  values: [String!]!
  to_dict: String
}

enum PyKeyword {
  class
  from
  import
  return
}

